name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master", "prod"]

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve image
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/digital-rental-backend:${{ github.event.workflow_run.head_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 165.232.168.251
          username: lenshub
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/lenshub/deploy.sh "${{ steps.image.outputs.image }}"