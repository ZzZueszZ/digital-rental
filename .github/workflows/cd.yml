name: CD

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact GHCR image using sha-<commit> tag or sha256 digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve image
        id: image
        shell: bash
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/digital-rental-backend"
          digest="${REQUESTED_IMAGE#"$image_name@sha256:"}"
          sha_tag="${REQUESTED_IMAGE#"$image_name:sha-"}"

          if [[ "$REQUESTED_IMAGE" == "$image_name@sha256:$digest" && "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "image=$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_IMAGE" == "$image_name:sha-$sha_tag" && "$sha_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image=$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Image must be $image_name@sha256:<64 hex> or $image_name:sha-<40 hex>"
            exit 1
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 165.232.168.251
          username: lenshub
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/lenshub/deploy.sh "${{ steps.image.outputs.image }}"
