  <text class="label" x="420" y="415">Quản lý hồ sơ, địa chỉ</text>
  <ellipse class="uc" cx="420" cy="495" rx="125" ry="34"/>
  <text class="label" x="420" y="495">Xác thực eKYC</text>
  <ellipse class="uc" cx="420" cy="575" rx="125" ry="34"/>
  <text class="label" x="420" y="575">Quản lý giỏ hàng</text>
  <ellipse class="uc" cx="420" cy="655" rx="125" ry="34"/>
  <text class="label" x="420" y="655">Mua sản phẩm</text>
  <ellipse class="uc" cx="420" cy="735" rx="125" ry="34"/>
  <text class="label" x="420" y="735">Thuê thiết bị</text>
  <ellipse class="uc" cx="420" cy="815" rx="125" ry="34"/>
  <text class="label" x="420" y="815">Theo dõi đơn hàng</text>
  <ellipse class="uc" cx="420" cy="895" rx="125" ry="34"/>
  <text class="label" x="420" y="895">Đánh giá sản phẩm</text>

  <!-- Use case nhân viên -->
  <ellipse class="uc" cx="740" cy="150" rx="125" ry="34"/>
  <text class="label" x="740" y="150">Xử lý đơn mua</text>
  <ellipse class="uc" cx="740" cy="230" rx="125" ry="34"/>
  <text class="label" x="740" y="230">Xử lý đơn thuê</text>
  <ellipse class="uc" cx="740" cy="310" rx="125" ry="34"/>
  <text class="label" x="740" y="310">Duyệt hồ sơ eKYC</text>
  <ellipse class="uc" cx="740" cy="390" rx="125" ry="34"/>
  <text class="label" x="740" y="390">Kiểm duyệt đánh giá</text>
  <ellipse class="uc" cx="740" cy="470" rx="125" ry="34"/>
  <text class="label" x="740" y="470">Xử lý hỗ trợ</text>

  <!-- Use case quản trị viên -->
  <ellipse class="uc" cx="1050" cy="150" rx="135" ry="34"/>
  <text class="label" x="1050" y="150">Quản lý sản phẩm, danh mục</text>
  <ellipse class="uc" cx="1050" cy="240" rx="135" ry="34"/>
  <text class="label" x="1050" y="240">Quản lý kho, thiết bị</text>
  <ellipse class="uc" cx="1050" cy="440" rx="135" ry="34"/>
  <text class="label" x="1050" y="440">Quản lý voucher</text>
  <ellipse class="uc" cx="1050" cy="530" rx="135" ry="34"/>
  <text class="label" x="1050" y="530">Quản lý người dùng</text>
  <ellipse class="uc" cx="1050" cy="620" rx="135" ry="34"/>
  <text class="label" x="1050" y="620">Xem thống kê, nhật ký</text>

  <!-- Use case Super Admin -->
  <ellipse class="uc" cx="1050" cy="815" rx="135" ry="34"/>
  <text class="label" x="1050" y="815">Quản lý vai trò</text>
  <ellipse class="uc" cx="1050" cy="905" rx="135" ry="34"/>
  <text class="label" x="1050" y="905">Quản lý quyền hạn</text>

  <!-- Liên kết tác nhân -->
  <path class="line" d="M125 205 L295 135 M125 205 L295 215 M125 205 L295 295"/>
  <path class="line" d="M125 635 L295 415 M125 635 L295 495 M125 635 L295 575 M125 635 L295 655 M125 635 L295 735 M125 635 L295 815 M125 635 L295 895"/>
  <path class="line" d="M1375 245 L865 150 M1375 245 L865 230 M1375 245 L865 310 M1375 245 L865 390 M1375 245 L865 470"/>
  <path class="line" d="M1375 595 L1185 150 M1375 595 L1185 240 M1375 595 L1185 440 M1375 595 L1185 530 M1375 595 L1185 620"/>
  <path class="line" d="M1375 885 L1185 815 M1375 885 L1185 905"/>

  <!-- Quan hệ include -->
  <ellipse class="uc" cx="730" cy="655" rx="115" ry="34"/>
  <text class="label" x="730" y="655">Thanh toán VNPay</text>
  <ellipse class="uc" cx="730" cy="735" rx="115" ry="34"/>
  <text class="label" x="730" y="735">Ký hợp đồng thuê</text>
  <path class="dash" d="M545 655 L615 655"/>
  <text x="580" y="642" font-size="13" text-anchor="middle">«include»</text>
  <path class="dash" d="M545 735 L615 735"/>
  <text x="580" y="722" font-size="13" text-anchor="middle">«include»</text>
</svg>
