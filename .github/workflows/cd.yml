name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve image
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/digital-rental-backend"
          echo "image=${image_name}:sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 165.232.168.251
          username: lenshub
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/lenshub/deploy.sh "${{ steps.image.outputs.image }}"
