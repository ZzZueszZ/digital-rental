server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 60MB
    max-swallow-size: 60MB
    max-parameter-count: 5000

vnpay:
  pay-url: ${PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  tmn-code: ${TMN_CODE}
  hash-secret: ${SECRET_KEY}
  return-url: ${RETURN_URL}
  version: ${VERSION:2.1.0}
  command: ${COMMAND:pay}
  order-type: ${ORDER_TYPE:other}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  #    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Nếu bạn dùng file .sql hoặc data.sql seed data
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

logging:
  level:
    org.web.identity: ${LOG_LEVEL_IDENTITY:info}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:warn}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:warn}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://www.lenshub.shop}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.lenshub.shop,https://lenshub.shop,https://digital-rental-lenshub.vercel.app}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:Admin Digital Rental}
      first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
      last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:Digital Rental}
      occupation: ${APP_BOOTSTRAP_ADMIN_OCCUPATION:System Administrator}
      company-name: ${APP_BOOTSTRAP_ADMIN_COMPANY_NAME:Digital Rental}
    super-admin:
      email: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      full-name: ${APP_BOOTSTRAP_SUPER_ADMIN_FULL_NAME:Super Admin}
      first-name: ${APP_BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${APP_BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
      occupation: ${APP_BOOTSTRAP_SUPER_ADMIN_OCCUPATION:Super Administrator}
      company-name: ${APP_BOOTSTRAP_SUPER_ADMIN_COMPANY_NAME:Digital Rental}
  e2ee:
    enabled: ${APP_E2EE_ENABLED:false}
    session-ttl-minutes: ${APP_E2EE_SESSION_TTL_MINUTES:30}
    nonce-ttl-minutes: ${APP_E2EE_NONCE_TTL_MINUTES:2}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://www.lenshub.shop/auth/google/callback}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    issuer: ${APP_JWT_ISSUER:zyna-app}
  activation:
    base-url: ${APP_ACTIVATION_BASE_URL:http://localhost:8080/api/auth/activate}
    ttl-hours: ${APP_ACTIVATION_TTL_HOURS:24}
    jwt-secret: ${APP_ACTIVATION_JWT_SECRET}
  mail:
    from: ${APP_MAIL_FROM:no-reply@zyna.dev}
    admin: ${APP_MAIL_ADMIN:adminlenshub@gmail.com}
  password-reset:
    ttl-minutes: ${APP_PASSWORD_RESET_TTL_MINUTES:10}
  scheduler:
    birthday:
      cron: ${APP_SCHEDULER_BIRTHDAY_CRON:0 0 6 * * ?}
      enabled: ${APP_SCHEDULER_BIRTHDAY_ENABLED:true}
    voucher-expiring:
      cron: ${APP_SCHEDULER_VOUCHER_EXPIRING_CRON:0 0 7 * * ?}
      enabled: ${APP_SCHEDULER_VOUCHER_EXPIRING_ENABLED:true}
      days-before: ${APP_SCHEDULER_VOUCHER_EXPIRING_DAYS_BEFORE:3}
  inventory:
    low-stock:
      threshold: ${APP_INVENTORY_LOW_STOCK_THRESHOLD:5}
  storage:
    minio:
      internal-endpoint: ${MINIO_INTERNAL_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:rental-assets}
      upload-expiry-minutes: ${MINIO_UPLOAD_EXPIRY_MINUTES:5}
      download-expiry-minutes: ${MINIO_DOWNLOAD_EXPIRY_MINUTES:5}
  kyc:
    provider: ${APP_KYC_PROVIDER:mock}
    timeout-ms: ${APP_KYC_TIMEOUT_MS:10000}
    fpt:
      api-key: ${FPT_KYC_API_KEY:}
      idr-url: ${FPT_KYC_IDR_URL:https://api.fpt.ai/vision/idr/vnm/}
      facematch-url: ${FPT_KYC_FACEMATCH_URL:https://api.fpt.ai/dmp/checkface/v1}
      liveness-url: ${FPT_KYC_LIVENESS_URL:https://api.fpt.ai/dmp/liveness/v3}
