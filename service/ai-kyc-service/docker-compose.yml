services:
  kyc-ai-service:
    build:
      context: .
    environment:
      KYC_AI_API_KEY: local-dev-key
      KYC_AI_FACE_MATCH_THRESHOLD: "80"
      KYC_AI_LIVENESS_THRESHOLD: "0.80"
      KYC_AI_MAX_UPLOAD_MB: "10"
      KYC_AI_LOG_LEVEL: INFO
      KYC_AI_LOG_OCR_TEXT: "true"
    ports:
      - "8000:8000"
