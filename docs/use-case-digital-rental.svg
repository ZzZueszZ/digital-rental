<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <style>
    text { font-family: Arial, sans-serif; fill: #171717; }
    .actor { stroke: #222; stroke-width: 2; fill: none; }
    .box { fill: #fff; stroke: #222; stroke-width: 2; }
    .uc { fill: #fff; stroke: #222; stroke-width: 1.8; }
    .line { stroke: #333; stroke-width: 1.6; fill: none; }
    .dash { stroke: #555; stroke-width: 1.4; fill: none; stroke-dasharray: 7 6; }
    .label { font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
    .actor-label { font-size: 18px; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect width="1500" height="1050" fill="white"/>
  <rect class="box" x="245" y="35" width="1010" height="975"/>
  <text class="title" x="750" y="70">HỆ THỐNG DIGITAL RENTAL</text>

  <!-- Khách truy cập -->
  <g class="actor">
    <circle cx="90" cy="170" r="16"/>
    <line x1="90" y1="186" x2="90" y2="240"/>
    <line x1="55" y1="205" x2="125" y2="205"/>
    <line x1="90" y1="240" x2="58" y2="280"/>
    <line x1="90" y1="240" x2="122" y2="280"/>
  </g>
  <text class="actor-label" x="90" y="310">Khách truy cập</text>

  <!-- Khách hàng -->
  <g class="actor">
    <circle cx="90" cy="600" r="16"/>
    <line x1="90" y1="616" x2="90" y2="670"/>
    <line x1="55" y1="635" x2="125" y2="635"/>
    <line x1="90" y1="670" x2="58" y2="710"/>
    <line x1="90" y1="670" x2="122" y2="710"/>
  </g>
  <text class="actor-label" x="90" y="740">Khách hàng</text>

  <!-- Nhân viên -->
  <g class="actor">
    <circle cx="1410" cy="210" r="16"/>
    <line x1="1410" y1="226" x2="1410" y2="280"/>
    <line x1="1375" y1="245" x2="1445" y2="245"/>
    <line x1="1410" y1="280" x2="1378" y2="320"/>
    <line x1="1410" y1="280" x2="1442" y2="320"/>
  </g>
  <text class="actor-label" x="1410" y="350">Nhân viên</text>

  <!-- Quản trị viên -->
  <g class="actor">
    <circle cx="1410" cy="560" r="16"/>
    <line x1="1410" y1="576" x2="1410" y2="630"/>
    <line x1="1375" y1="595" x2="1445" y2="595"/>
    <line x1="1410" y1="630" x2="1378" y2="670"/>
    <line x1="1410" y1="630" x2="1442" y2="670"/>
  </g>
  <text class="actor-label" x="1410" y="700">Quản trị viên</text>

  <!-- Super Admin -->
  <g class="actor">
    <circle cx="1410" cy="850" r="16"/>
    <line x1="1410" y1="866" x2="1410" y2="920"/>
    <line x1="1375" y1="885" x2="1445" y2="885"/>
    <line x1="1410" y1="920" x2="1378" y2="960"/>
    <line x1="1410" y1="920" x2="1442" y2="960"/>
  </g>
  <text class="actor-label" x="1410" y="990">Super Admin</text>

  <!-- Use case khách -->
  <ellipse class="uc" cx="420" cy="135" rx="125" ry="34"/>
  <text class="label" x="420" y="135">Xem, tìm kiếm sản phẩm</text>
  <ellipse class="uc" cx="420" cy="215" rx="125" ry="34"/>
  <text class="label" x="420" y="215">Đăng ký, đăng nhập</text>
  <ellipse class="uc" cx="420" cy="295" rx="125" ry="34"/>
