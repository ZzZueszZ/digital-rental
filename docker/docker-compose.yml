services:
  mysql-db:
    image: mysql:8.0
    container_name: cms_mysql_dev
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: cms_dev
      MYSQL_USER: cms_dev
      MYSQL_PASSWORD: "cms_dev!@#456"
      MYSQL_ROOT_PASSWORD: your_root_password
    ports:
      - "33003:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  lenshub-postgres:
    image: postgres:15-alpine
    container_name: lenshub_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123123"
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  lenshub-redis:
    image: redis:7-alpine
    container_name: lenshub_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  redis_data: